# The gate, run by something other than the person who wrote the change.
#
# scripts/check-all.sh is this project's definition of "did that work", and
# until now nothing ran it automatically. Every claim that it passed on a pull
# request was the author's word — including an autonomous agent's, which is
# exactly the case AUTONOMY.md is written for:
#
#   "A model asked whether it improved something will say yes; this script is
#    the part that disagrees."
#
# A disagreeing script nobody independently runs is back to being the author's
# word. This runs it.
#
# It became worth adding only once the gate could run without a database and
# without a drawn calibration set — before that it would have reported two of
# seven gates SKIPPED on every CI run, which is worse than nothing, because a
# green tick over a run that checked nothing is how a skipped gate becomes
# invisible.
#
# TWO PROPERTIES THIS FILE MUST KEEP:
#
#   1. **No secrets, ever.** There is no `secrets:` reference below and there
#      must never be one. The gate's export and labeller checks run against a
#      generated fixture, so nothing here calls a vendor or a judge. That is
#      what makes it structurally unable to spend money on a pull request —
#      a stronger guarantee than trusting it not to. A change that adds a
#      secret here is a change that lets an arbitrary branch spend the
#      founder's API budget.
#
#   2. **Read-only.** `permissions: contents: read`, deliberately narrower than
#      the default. This workflow inspects; weekly.yml is the only thing that
#      writes.

name: Checks

on:
  pull_request:
  push:
    branches: [main]

# Least privilege. Nothing here needs to write, and a checks workflow that can
# push is a checks workflow that can be talked into pushing.
permissions:
  contents: read

# A new push to the same pull request makes the previous run's answer
# irrelevant. Cancelling it keeps the minute cost proportional to the number of
# changes rather than the number of keystrokes — this repository is private, so
# Actions minutes are metered rather than free.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    # The gate is seconds of work; the ceiling is here to bound a hang, not to
    # accommodate a slow run.
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: |
          pip install --require-hashes -r requirements.txt
          # `npm ci` from the committed lockfile, never `npm install --no-save`:
          # the latter reconciles the tree against package.json and has pruned
          # jsdom in this repository before, which turned two green checks into
          # two silent skips. CHECK_STRICT (exported by check-all.sh) makes that
          # loud now, but installing correctly is the actual fix.
          npm ci

      # check-all.sh prefers .venv/bin/python and falls back to python3, which
      # is what setup-python provides. It exports CHECK_STRICT=1 itself, so a
      # missing dependency fails the gate rather than skipping past it.
      - name: scripts/check-all.sh
        run: |
          set -o pipefail
          bash scripts/check-all.sh 2>&1 | tee gate.log
          # A skipped gate verified nothing, and CI is precisely where that
          # distinction gets lost: a green tick over a run in which two checks
          # did not happen reads identically to a green tick over a run in
          # which they did. On a developer's machine a skip is information; here
          # it is a failure.
          #
          # There is no legitimate skip in this job. `--quick` is not passed,
          # and both inputs that used to be absent — the database and the drawn
          # calibration set — are generated by the gate itself.
          if grep -q "SKIPPED" gate.log; then
            echo "::error::a gate was SKIPPED — in CI that is a failure, not a pass"
            exit 1
          fi

      - name: Install Chromium for rendered browser checks
        run: npx playwright install --with-deps chromium

      - name: Rendered accessibility and interaction regressions
        run: node scripts/check-browser.mjs site

      - name: Offline end-to-end demo and recovery
        run: |
          python -m src.demo --out .demo
          node scripts/check-browser.mjs .demo/site --demo
