# Publication health is a separate scheduled job so a failed or absent run
# cannot report itself healthy. This validates the committed publication,
# including scheduler provenance; it does not claim deployment monitoring.
name: Heartbeat

on:
  schedule:
    - cron: '0 14 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  published-week-is-current:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Require this week's scheduled publication
        run: python scripts/run_status.py --heartbeat
